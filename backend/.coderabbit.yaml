language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  instructions: |
    You are an expert backend engineer reviewing a Node.js application.
    - Follow clean code principles: ensure functions have a single responsibility (SRP), keep them concise, and use descriptive naming.
    - Ensure there are no leftover `console.log` statements; use a structured logger (e.g., Winston or Pino) instead.
    - Ensure all asynchronous code properly handles errors using `try-catch` blocks or centralized error-handling middleware to prevent unhandled promise rejections.
    - Ensure all incoming requests (body, query, params) are strictly validated before hitting the business logic.
    - Ensure sensitive data (passwords, JWT secrets, database credentials, API keys) are never hardcoded and are securely managed via environment variables.
    - Flag any implicit `any` types if TypeScript is used.
    - Ensure database queries or operations are optimized, safe from injection vulnerabilities, and follow best practices.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
chat:
  auto_reply: true